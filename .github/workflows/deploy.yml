name: Deploy staging
on:
  push:
    branches: [main]

# Needs repo secrets CLOUDFLARE_API_TOKEN (Edit Cloudflare Workers template + D1 Edit) and CLOUDFLARE_ACCOUNT_ID.
# ponytail: staging only; add a `v*` tag job for production once its D1/R2/Workers exist.
concurrency: deploy-staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Migrate D1 (before deploy; migrations are additive)
        run: npx wrangler d1 migrations apply DB --remote
        working-directory: apps/web
      - run: npx wrangler deploy
        working-directory: apps/web
      - run: npx wrangler deploy
        working-directory: apps/cms
      - name: Smoke test
        run: |
          curl -fsS -o /dev/null https://staging.chillymenu.party/r/demo/pt
          curl -fsS -o /dev/null https://staging.chillymenu.party/admin/
