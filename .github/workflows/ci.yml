name: CI
on:
  pull_request:
  push:
    branches: [main]

# Required checks for merging into main (repo ruleset): `test` and `e2e`.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Worker tests (built worker in workerd, local D1)
        run: npm run test:worker:only -w @chilly/web

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -w @chilly/web

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests (built worker, real browser, throw-away local D1)
        run: npm run test:e2e:only -w @chilly/web

      - name: Upload e2e report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
