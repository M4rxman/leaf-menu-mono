name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Required checks for merging into main (repo ruleset): `test` and `e2e`.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Worker tests (built worker in workerd, local D1)
        run: npm run test:worker:only -w @chilly/web

      - name: CMS worker tests
        run: npm run test:worker:only -w @chilly/cms

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -w @chilly/web

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests (built worker, real browser, throw-away local D1)
        run: npm run test:e2e:only -w @chilly/web

      - name: Upload e2e report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
