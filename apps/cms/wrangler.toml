name = "chilly-cms"
main = ".output/server/index.mjs"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
assets = { directory = ".output/public", binding = "ASSETS" }

# Same database and bucket as apps/web (one D1, one R2 for all venues).
[[d1_databases]]
binding = "DB"
database_name = "chilly-menu-eu"
database_id = "8e739f6a-6caf-4115-a370-71b680aeef3b"
migrations_dir = "../../packages/shared/migrations"

# Secret (wrangler secret put PASSWORD_PEPPER; local: apps/cms/.dev.vars): PASSWORD_PEPPER. Keep a copy in the
# password manager: without it no stored password verifies (an admin reset still works).

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "chilly-photos-staging"
